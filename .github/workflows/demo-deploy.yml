name: Deploy demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/demo-deploy.yml
permissions:
  contents: read
concurrency:
  group: demo-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DEMO_AUTODEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    defaults:
      run:
        working-directory: demo
    env:
      VITE_CONVEX_URL: https://reliable-lyrebird-289.convex.cloud
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify deployment credentials are configured
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || { echo 'Missing CONVEX_DEPLOY_KEY in the demo environment'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN in the demo environment'; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Deploy the demo backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx --no-install convex deploy --yes
      - name: Publish the static frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy
